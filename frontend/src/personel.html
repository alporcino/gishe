<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071A3F">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <title>Gishe – Personel paneli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&family=Manrope:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="panel">
    <aside class="yan-menu">
      <div style="display:flex;flex-direction:column;gap:12px;padding:0 4px">
        <span class="logo-kutu"><img class="gtu-logo" src="gtu-logo.png" alt="Gebze Teknik Üniversitesi" style="height:56px;width:auto;display:block" onerror="this.parentNode.remove()"></span>
        <span class="marka-yazi"><strong>Gishe</strong><span>Personel paneli</span></span>
      </div>
      <div class="kullanici">
        <strong id="kullanici-ad" style="font-size:14px">…</strong>
        <span id="kullanici-birim" style="font-size:12px;color:var(--gece-yazi)"></span>
      </div>
      <nav aria-label="Talep filtreleri" id="filtreler">
        <button type="button" data-filtre="acik" aria-pressed="true">Açık talepler <span class="rozet" id="rozet-acik">0</span></button>
        <button type="button" data-filtre="asan" aria-pressed="false">Süresi aşanlar <span class="rozet uyari" id="rozet-asan">0</span></button>
        <button type="button" data-filtre="kapali" aria-pressed="false">Sonuçlananlar</button>
      </nav>
      <div class="alt">
        <button type="button" id="cikis">Çıkış yap</button>
        <button type="button" id="sifirla" hidden>Örnek verileri sıfırla</button>
      </div>
    </aside>

    <main class="ana">
      <div class="ust-satir" style="flex-wrap:wrap">
        <div>
          <h1 id="baslik">Gelen talepler</h1>
          <span class="kucuk soluk" id="daire"></span>
        </div>
        <span class="cok-kucuk soluk">Liste 10 saniyede bir kendiliğinden yenilenir.</span>
      </div>

      <div class="istatistikler" id="istatistikler"></div>

      <div class="iki-sutun">
        <div class="tablo-kutu">
          <table>
            <thead>
              <tr><th>No</th><th>Konu</th><th>Talep eden</th><th>Bu birimde</th><th>Durum</th></tr>
            </thead>
            <tbody id="tablo"><tr><td colspan="5"><span class="iskelet" style="height:44px"></span></td></tr><tr><td colspan="5"><span class="iskelet" style="height:44px"></span></td></tr><tr><td colspan="5"><span class="iskelet" style="height:44px"></span></td></tr></tbody>
          </table>
        </div>
        <section class="kart detay" id="detay" aria-live="polite">
          <div class="bos">Ayrıntıyı görmek için listeden bir talep seçin.</div>
        </section>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="ortak.js"></script>
  <script src="personel.js"></script>
</body>
</html>
